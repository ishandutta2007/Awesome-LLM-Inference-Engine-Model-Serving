<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d17" />
      <stop offset="50%" stop-color="#10172a" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <linearGradient id="primaryTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="35%" stop-color="#a78bfa" />
      <stop offset="70%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="badgeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="badgeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="pulseLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="ambientGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60" />
    </filter>

    <style>
      .bg-grid {
        stroke: rgba(255, 255, 255, 0.035);
        stroke-width: 1;
      }
      .node-pulse {
        animation: pulseAnim 3s infinite ease-in-out;
      }
      .beam-glow {
        animation: beamMove 6s infinite linear;
      }
      .chip-flow {
        animation: chipFlow 4s infinite ease-in-out alternate;
      }
      .floating-particle {
        animation: floatAnim 5s infinite ease-in-out alternate;
      }
      @keyframes pulseAnim {
        0%, 100% { transform: scale(1); opacity: 0.4; }
        50% { transform: scale(1.15); opacity: 0.8; }
      }
      @keyframes floatAnim {
        0% { transform: translateY(0px) rotate(0deg); }
        100% { transform: translateY(-12px) rotate(3deg); }
      }
      @keyframes beamMove {
        0% { stroke-dashoffset: 1000; }
        100% { stroke-dashoffset: 0; }
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1280" height="440" fill="url(#bgGrad)" />

  <!-- Ambient Blurred Orbs (Deep Background) -->
  <circle cx="200" cy="120" r="140" fill="#3b82f6" opacity="0.18" filter="url(#ambientGlow)" />
  <circle cx="1080" cy="300" r="160" fill="#ec4899" opacity="0.15" filter="url(#ambientGlow)" />
  <circle cx="640" cy="220" r="180" fill="#8b5cf6" opacity="0.12" filter="url(#ambientGlow)" />

  <!-- Cyber Grid Background -->
  <g class="bg-grid">
    <path d="M 0,60 L 1280,60 M 0,120 L 1280,120 M 0,180 L 1280,180 M 0,240 L 1280,240 M 0,300 L 1280,300 M 0,360 L 1280,360 M 0,420 L 1280,420" />
    <path d="M 100,0 L 100,440 M 220,0 L 220,440 M 340,0 L 340,440 M 460,0 L 460,440 M 580,0 L 580,440 M 700,0 L 700,440 M 820,0 L 820,440 M 940,0 L 940,440 M 1060,0 L 1060,440 M 1180,0 L 1180,440" />
  </g>

  <!-- Dynamic Animated Circuit / Flow Lines (Background Layer) -->
  <g opacity="0.7">
    <path d="M 80,380 Q 320,380 440,320 T 840,320 T 1200,380" fill="none" stroke="url(#pulseLineGrad)" stroke-width="2" stroke-dasharray="16, 8" />
    <path d="M 120,80 Q 400,140 640,80 T 1160,80" fill="none" stroke="url(#pulseLineGrad)" stroke-width="1.5" stroke-dasharray="12, 12" />
  </g>

  <!-- Geometric Accent Nodes (Edges) -->
  <g opacity="0.6" class="floating-particle">
    <rect x="90" y="110" width="16" height="16" rx="4" fill="none" stroke="#60a5fa" stroke-width="1.5" />
    <circle cx="98" cy="118" r="3" fill="#60a5fa" />
    <rect x="1170" y="130" width="18" height="18" rx="4" fill="none" stroke="#f472b6" stroke-width="1.5" />
    <circle cx="1179" cy="139" r="3" fill="#f472b6" />
    <circle cx="160" cy="330" r="5" fill="#a78bfa" />
    <circle cx="1120" cy="310" r="5" fill="#34d399" />
  </g>

  <!-- Dynamic Wave Stream across the bottom -->
  <path d="M 0,410 C 320,390 480,430 800,405 C 1040,385 1160,425 1280,410" fill="none" stroke="rgba(168, 85, 247, 0.4)" stroke-width="2" />

  <!-- FOREGROUND CONTENT: Safe Layer (guaranteed crisp visibility) -->
  <g id="foreground">
    <!-- Top Decorative Badge -->
    <g transform="translate(640, 72)" text-anchor="middle">
      <rect x="-190" y="-18" width="380" height="36" rx="18" fill="url(#badgeGrad1)" stroke="rgba(147, 197, 253, 0.4)" stroke-width="1.2" />
      <circle cx="-165" cy="0" r="5" fill="#38bdf8" />
      <text x="5" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#93c5fd" letter-spacing="1.5">
        ⚡ ULTRA-HIGH THROUGHPUT &amp; LOW LATENCY
      </text>
    </g>

    <!-- Main Title -->
    <text x="640" y="170" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="46" font-weight="900" fill="url(#primaryTextGrad)" letter-spacing="-0.5" filter="url(#glow)">
      Awesome LLM Inference &amp; Serving
    </text>

    <!-- Subtitle -->
    <text x="640" y="222" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#cbd5e1" letter-spacing="0.2">
      Curated Roster of GPU Inference Engines, Edge Runtimes &amp; Production Serving Platforms
    </text>

    <!-- Interactive / Status Pills (Horizontal Carousel of Tags) -->
    <g transform="translate(640, 292)" text-anchor="middle">
      <!-- Tag 1 -->
      <g transform="translate(-410, 0)">
        <rect x="-85" y="-16" width="170" height="34" rx="17" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(59, 130, 246, 0.5)" stroke-width="1" />
        <text x="0" y="6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#60a5fa">🔥 vLLM &amp; SGLang</text>
      </g>
      <!-- Tag 2 -->
      <g transform="translate(-210, 0)">
        <rect x="-95" y="-16" width="190" height="34" rx="17" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(168, 85, 247, 0.5)" stroke-width="1" />
        <text x="0" y="6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#c084fc">🚀 TensorRT-LLM &amp; TGI</text>
      </g>
      <!-- Tag 3 -->
      <g transform="translate(0, 0)">
        <rect x="-90" y="-16" width="180" height="34" rx="17" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(236, 72, 153, 0.5)" stroke-width="1" />
        <text x="0" y="6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#f472b6">💻 llama.cpp &amp; Ollama</text>
      </g>
      <!-- Tag 4 -->
      <g transform="translate(205, 0)">
        <rect x="-95" y="-16" width="190" height="34" rx="17" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(16, 185, 129, 0.5)" stroke-width="1" />
        <text x="0" y="6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#34d399">⚡ Speculative Decoding</text>
      </g>
      <!-- Tag 5 -->
      <g transform="translate(405, 0)">
        <rect x="-85" y="-16" width="170" height="34" rx="17" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(245, 158, 11, 0.5)" stroke-width="1" />
        <text x="0" y="6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#fbbf24">🌐 WebGPU &amp; Edge</text>
      </g>
    </g>

    <!-- Bottom Metric Highlight Bar -->
    <g transform="translate(640, 360)" text-anchor="middle">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#64748b" letter-spacing="1.2">
        OPEN-SOURCE RUNTIMES  •  CUSTOM ASICs (LPU/WSE)  •  SERVERLESS GPUS  •  ENTERPRISE MULTI-NODE
      </text>
    </g>
  </g>
</svg>
